[Service]
# PRD-grand-loop-listings-dedicated-clone requirement 6: listings evidence
# now lives in its own clone (see mcphost_deploy.constants.listings_clone_dir),
# not the live ~/Documents/PRDs checkout. This just names the same default
# constants.py already resolves to, so `mcphost-deploy publish|measure`
# invoked by grand-loop-tick.sh under this unit's near-empty systemd PATH/env
# is unambiguous about it even if the default ever changes.
Environment=MCPHOST_DEPLOY_LISTINGS_CLONE=%h/.cache/mcphost-deploy/prds-clone
