# A388 round 3 (Hermes 2026-11-20; review 11c89fff F2): the grader runs through grader-jyenpm-run.sh (non-Fable lane account, pinned binding
# claude-opus-5-5 high, engine preflight) and drains until empty: no overall batch ceiling. --limit 50 is Joe's 11-02 batch size (a per-call page).
# SOURCE-ONLY until installed: replaces the carbon-local 99z (sha256 efb1f824c0f10735e9ddf62e2c319d3f03cdc77930e5d13e94cff84cd460fbc2, '--max-batches 40').
# TimeoutStartSec=infinity overrides the 3h in carbon's 99-joe-quota-conservation.conf: a drain has no runtime ceiling; each model call keeps its hang guard.
[Service]
ExecStart=
ExecStart=%h/.local/bin/grader-jyenpm-run.sh regrade --backlog --include-tooling --limit 50 --drain
TimeoutStartSec=infinity
