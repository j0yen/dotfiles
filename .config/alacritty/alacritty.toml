[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
size = 14

[window]
padding = { x = 0, y = 0 }
decorations = "full"
# Force dark titlebar; the login-autostart window otherwise falls back to light
# because it opens before the desktop color-scheme setting is readable.
decorations_theme_variant = "Dark"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# Catppuccin Mocha (Joe 2026-10-15)
[colors.primary]
background = '#1e1e2e'
foreground = '#cdd6f4'
dim_foreground = '#7f849c'
bright_foreground = '#cdd6f4'

[colors.cursor]
text   = '#1e1e2e'
cursor = '#f5e0dc'

[colors.vi_mode_cursor]
text   = '#1e1e2e'
cursor = '#b4befe'

[colors.search.matches]
foreground = '#1e1e2e'
background = '#a6adc8'

[colors.search.focused_match]
foreground = '#1e1e2e'
background = '#a6e3a1'

[colors.footer_bar]
foreground = '#1e1e2e'
background = '#a6adc8'

[colors.hints.start]
foreground = '#1e1e2e'
background = '#f9e2af'

[colors.hints.end]
foreground = '#1e1e2e'
background = '#a6adc8'

[colors.selection]
text       = '#1e1e2e'
background = '#f5e0dc'

[colors.normal]
black   = '#45475a'
red     = '#f38ba8'
green   = '#a6e3a1'
yellow  = '#f9e2af'
blue    = '#89b4fa'
magenta = '#f5c2e7'
cyan    = '#94e2d5'
white   = '#bac2de'

[colors.bright]
black   = '#585b70'
red     = '#f38ba8'
green   = '#a6e3a1'
yellow  = '#f9e2af'
blue    = '#89b4fa'
magenta = '#f5c2e7'
cyan    = '#94e2d5'
white   = '#a6adc8'

[colors.dim]
black   = '#45475a'
red     = '#f38ba8'
green   = '#a6e3a1'
yellow  = '#f9e2af'
blue    = '#89b4fa'
magenta = '#f5c2e7'
cyan    = '#94e2d5'
white   = '#bac2de'

[cursor]
style = { shape = "Block", blinking = "Off" }

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
