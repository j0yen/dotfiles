[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
size = 14

[window]
padding = { x = 0, y = 0 }
decorations = "full"
# Force dark titlebar; the login-autostart window otherwise falls back to light
# because it opens before the desktop color-scheme setting is readable.
decorations_theme_variant = "Dark"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# Gruvbox Dark (hard contrast) — original wintermute palette (reverted from Tokyo Night 2026-10-15)
[colors.primary]
background = '#1d2021'
foreground = '#ebdbb2'

[colors.normal]
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
