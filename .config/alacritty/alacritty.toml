[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
size = 14

[window]
padding = { x = 0, y = 0 }
decorations = "full"
# Force dark titlebar; the login-autostart window otherwise falls back to light
# because it opens before the desktop color-scheme setting is readable.
decorations_theme_variant = "Dark"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# Green phosphor — the original wintermute terminal (constellation 2026-06-05, 4491792)
[colors.primary]
background = '#000000'
foreground = '#28FE14'

[colors.cursor]
text   = '#000000'
cursor = '#28FE14'

[colors.normal]
black   = '#000000'
red     = '#c91b00'
green   = '#1FC710'
yellow  = '#c7c400'
blue    = '#003299'
magenta = '#8000ff'
cyan    = '#28FE14'
white   = '#c0c0c0'

[colors.bright]
black   = '#3f3f3f'
red     = '#ff4136'
green   = '#28FE14'
yellow  = '#ffdc00'
blue    = '#0074d9'
magenta = '#b10dc9'
cyan    = '#7fdbff'
white   = '#ffffff'

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
