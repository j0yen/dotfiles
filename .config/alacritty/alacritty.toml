[font]
normal = { family = "DejaVu Sans Mono", style = "Regular" }
size = 14

[window]
padding = { x = 0, y = 0 }
decorations = "full"
# Force dark titlebar; the login-autostart window otherwise falls back to light
# because it opens before the desktop color-scheme setting is readable.
decorations_theme_variant = "Dark"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true

# Everforest Dark (hard) (Joe 2026-10-15)
[colors.primary]
background = '#272e33'
foreground = '#d3c6aa'

[colors.cursor]
text   = '#272e33'
cursor = '#d3c6aa'

[colors.selection]
text       = 'CellForeground'
background = '#414b50'

[colors.normal]
black   = '#414b50'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[colors.bright]
black   = '#7a8478'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

[cursor]
style = { shape = "Block", blinking = "Off" }

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"
