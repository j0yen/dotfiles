# Auto-generated by wm-build's gate pre-stage (no agent/proof-lanes.toml
# existed for grand-loop-liveness-contract) -- one catch-all lane so `vti-plan` has real
# config to route every changed path against instead of crashing for
# lack of any file at all. Narrow this by hand (or let a later coder
# pass add scoped lanes, same convention as PRD-mcphost-*'s own
# lanes) once the repo's test layout is established.
[[lane]]
id = "all"
description = "Catch-all: every path in this repo, proven by its full test suite. Auto-generated -- narrow into scoped lanes as the repo's test layout is established."
globs = ["**"]
required_commands = ["cargo test"]

[[lane]]
id = "operator-status-card"
description = "Operator status card: generator, SessionStart renderer, UserPromptSubmit notices hook, settings wiring, proven by the ocard_ac* shell tests."
globs = [".claude/scripts/operator-status-gen.sh", ".claude/scripts/operator-status-card.sh", ".claude/hooks/operator-notices.sh", ".claude/settings.json", "tests/ocard_*", "tests/fixtures/ocard-*"]
required_commands = ["for t in tests/ocard_ac*.test.sh; do bash \"$t\" || exit 1; done"]

[[lane]]
id = "park-fresh-fact"
description = "Park freshness hook: park-fresh-fact.sh PreToolUse hook, settings wiring, proven by the pfact_ac* shell tests."
globs = [".claude/hooks/park-fresh-fact.sh", ".claude/settings.json", "tests/pfact_*"]
required_commands = ["for t in tests/pfact_ac*.test.sh; do bash \"$t\" || exit 1; done"]

[[lane]]
id = "overlap-digest"
description = "Sibling overlap digest: overlap-digest.sh, its hourly user timer/service, proven by the sodig_ac* shell tests."
globs = [".local/bin/overlap-digest.sh", ".config/systemd/user/operator-overlap-digest.*", "tests/sodig_*"]
required_commands = ["for t in tests/sodig_ac*.test.sh; do bash \"$t\" || exit 1; done"]

[[lane]]
id = "handoff-generated"
description = "Generated handoff: handoff-gen.sh (SessionEnd), handoff-lint.sh, settings wiring, status-gen refresh hook, proven by the hgen_ac* shell tests."
globs = [".claude/scripts/handoff-gen.sh", ".claude/scripts/handoff-lint.sh", ".claude/scripts/operator-status-gen.sh", ".claude/settings.json", "tests/hgen_*", "tests/fixtures/hgen-*"]
required_commands = ["for t in tests/hgen_ac*.test.sh; do bash \"$t\" || exit 1; done"]
